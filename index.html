<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小稀罕⭐下百层</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #FFF6E3 0%, #FFEECF 60%, #FFE8C2 100%);
    user-select: none; -webkit-user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
  }
  .hidden { display: none !important; }
  .title {
    font-size: 40px; font-weight: 800; color: #5B4232; letter-spacing: 2px;
    text-shadow: 0 3px 0 #FFE3AE;
  }
  .title .star { color: #F5A623; }
  .subtitle { font-size: 15px; color: #A07B5B; margin-top: -6px; }
  #menuImg {
    width: 150px; height: 150px; object-fit: contain;
    filter: drop-shadow(0 6px 10px rgba(150, 100, 50, .25));
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .btn {
    border: none; border-radius: 999px; cursor: pointer;
    font-size: 19px; font-weight: 700; padding: 14px 46px; color: #5B4232;
    background: linear-gradient(180deg, #FFD34D, #FFBE30);
    box-shadow: 0 5px 0 #E39B1B, 0 8px 14px rgba(200, 140, 40, .35);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #E39B1B; }
  .btn.small { font-size: 14px; padding: 9px 26px; background: #FFF; color: #A07B5B; box-shadow: 0 3px 0 #EAD9BC; font-weight: 600; }
  .best { font-size: 14px; color: #B08A63; }
  .best b { color: #F5A623; font-size: 18px; }
  .tip { font-size: 13px; color: #C2A180; line-height: 1.7; }
  .heart { color: #FF6B81; }
  #overImg { width: 110px; height: 110px; object-fit: contain; transform: rotate(-8deg); }
  #overTitle { font-size: 30px; font-weight: 800; color: #5B4232; }
  #overScore { font-size: 16px; color: #A07B5B; }
  #overScore b { color: #F5A623; font-size: 34px; margin: 0 4px; }
  #newBest { font-size: 14px; color: #FF6B81; font-weight: 700; }
  #controls { position: fixed; bottom: 0; left: 0; right: 0; height: 30%; z-index: 5; display: flex; pointer-events: none; }
  .ctrl-half { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 26px; pointer-events: auto; }
  .ctrl-btn {
    width: 74px; height: 74px; border-radius: 50%;
    background: rgba(255, 255, 255, .55); border: 3px solid rgba(200, 150, 90, .35);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #B98A55; font-weight: 800;
  }
  .ctrl-btn.pressed { background: rgba(255, 211, 77, .8); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="overlay" id="menu">
  <img id="menuImg" alt="角色" src="">
  <div class="title">小稀罕<span class="star">⭐</span>下百层</div>
  <div class="subtitle">别被顶上去！往下走～</div>
  <button class="btn" id="startBtn">开 始 游 戏</button>
  <div class="best">最深纪录 <b id="bestVal">0</b> 层</div>
  <div class="tip">左右按钮 / 点屏幕左右半边 移动<br>板子不停<b>往上顶</b>，你左右走找缝往下掉<br>碰到<span style="color:#8A5A3B">尖刺板</span>或顶端<span style="color:#8A5A3B">尖刺</span>掉 1 格❤，2 格掉光结束 <span class="heart">♥</span></div>
</div>

<div class="overlay hidden" id="over">
  <img id="overImg" alt="" src="">
  <div id="overTitle">爱心掉光啦！</div>
  <div id="overScore">这次下了 <b>0</b> 层</div>
  <div id="newBest" class="hidden">✦ 新纪录！✦</div>
  <button class="btn" id="retryBtn">再 来 一 次</button>
  <button class="btn small" id="homeBtn">回主页</button>
</div>

<div id="controls" class="hidden">
  <div class="ctrl-half" id="leftZone"><div class="ctrl-btn" id="leftBtn">◀</div></div>
  <div class="ctrl-half" id="rightZone"><div class="ctrl-btn" id="rightBtn">▶</div></div>
</div>

var playerImg = new Image();
var imgReady = false;
playerImg.onload = function () { imgReady = true; if (playerImg.width && playerImg.height) PW = Math.round(PH * playerImg.width / playerImg.height); };
playerImg.src = PLAYER_SRC;
$("menuImg").src = PLAYER_SRC;
$("overImg").src = PLAYER_SRC;

var S = { MENU: 0, PLAY: 1, OVER: 2 };
var state = S.MENU;
var best = parseInt(localStorage.getItem("qqfall_best") || "0", 10) || 0;
$("bestVal").textContent = best;

/* ---------- 参数 ---------- */
var GRAV = 2100, MAXFALL = 820, MOVE = 440, PW = 40, PH = 58;
var CEIL_Y = 30;            // 顶端尖刺天花板下沿
var INVULN = 1.2;           // 受击后无敌时间(秒)

var player, plats, coins, parts, sparkles;
var score, coinsGot, hearts, invuln, grounded, groundedPlat;
var scrollSpd, lastY, dir = 0, leftOn = false, rightOn = false;

var BREAK_DELAY = 0.5;       // 碎板踩上后碎裂延迟(秒)

function rowGap() { return Math.min(74 + score * 0.4, 108); }      // 行间距(越小越密, 掉落更顺)
function platWidth() { return Math.max(118 - score * 0.6, 64); }   // 单块板宽
function spikeChance() { return Math.min(0.06 + score * 0.004, 0.26); }
function moveChance() { return Math.min(0.05 + score * 0.003, 0.26); }
function breakChance() { return Math.min(0.05 + score * 0.003, 0.20); }

// 散布短条板: 正常 / 带刺 / 会碎 / 左右移动 四种
function newPlat(y, x, w) {
  var type = "normal", roll = Math.random();
  var sp = spikeChance(), mv = moveChance(), bk = breakChance();
  if (roll < sp) type = "spike";
  else if (roll < sp + mv) type = "move";
  else if (roll < sp + mv + bk) type = "break";
  return {
    x: x, y: y, w: w, h: 18, type: type,
    baseX: x, px: x, phase: Math.random() * 6.28,
    amp: 26 + Math.random() * 46,
    scored: false, hit: false,
    solid: true, breaking: false, broken: false, breakT: 0
  };
}
// 生成某一行(散布 1~2 块短板, 留可穿过的缝隙)
function makeRowBars(y) {
  var arr = [], x = 6 + Math.random() * 36;
  while (x < W - 44) {
    var w = platWidth() * (0.7 + Math.random() * 0.6);
    if (x + w > W - 6) w = W - 6 - x;
    if (w < 48) break;
    arr.push(newPlat(y, x, w));
    x += w + (62 + Math.random() * 78);   // 板间缝隙 62~140(宽于角色, 可穿下)
  }
  if (arr.length === 0) arr.push(newPlat(y, W / 2 - platWidth() / 2, platWidth()));
  return arr;
}

// 在某行板子上(低概率)挂一个闪电: 只挂非尖刺板, 公平且不会被逼着踩刺; 闪电会跟随那块板移动/上升
function spawnCoinOnRow(bars) {
  if (Math.random() >= 0.2) return;            // 出现频率不高
  var cand = [];
  for (var j = 0; j < bars.length; j++) if (bars[j].type !== "spike") cand.push(bars[j]);
  if (!cand.length) return;
  var b = cand[Math.floor(Math.random() * cand.length)];
  coins.push({ bar: b, x: b.x + b.w / 2, y: b.y - 24, got: false, t: Math.random() * 6.28 });
}

function reset() {
  plats = []; coins = []; parts = [];
  score = 0; coinsGot = 0; hearts = 2; invuln = 0;
  grounded = false; groundedPlat = null;
  dir = 0; leftOn = rightOn = false;

  var startY = H * 0.5;
  player = { x: W / 2 - PW / 2, y: startY, vx: 0, vy: 0, face: 1, squash: 0 };

  // 起始安全板(玩家正下方, 宽的普通板, 不计入分数)
  var p0 = newPlat(startY + PH, W / 2 - platWidth() / 2, platWidth());
  p0.type = "normal"; p0.scored = true;
  plats.push(p0);
  player.y = p0.y - PH; grounded = true; groundedPlat = p0;
  lastY = p0.y;

  // 向下填满到屏底之外(散布短条, 保证可见区底部始终有板)
  var guard = 0, k;
  while (lastY < H + 120 && guard++ < 200) {
    lastY += rowGap();
    var rb = makeRowBars(lastY);
    for (k = 0; k < rb.length; k++) plats.push(rb[k]);
    spawnCoinOnRow(rb);
  }
  // 向上填满到天花板
  guard = 0;
  while (plats[0].y > CEIL_Y + 60 && guard++ < 90) {
    var ty = plats[0].y - rowGap();
    var rb2 = makeRowBars(ty);
    for (k = 0; k < rb2.length; k++) plats.unshift(rb2[k]);
  }

  sparkles = [];
  for (var i = 0; i < 16; i++) {
    sparkles.push({ x: Math.random() * W, y: Math.random() * H, s: 0.4 + Math.random() * 1.2, t: Math.random() * 6.28 });
  }
}

/* ---------- 平台贴图预渲染 ---------- */
var platCanvas = document.createElement("canvas");
platCanvas.width = 260; platCanvas.height = 30;
(function () {
  var c = platCanvas.getContext("2d");
  var g = c.createLinearGradient(0, 0, 0, 24);
  g.addColorStop(0, "#FFDC7E"); g.addColorStop(1, "#FFC95E");
  c.fillStyle = g; roundRect(c, 2, 2, 256, 22, 11); c.fill();
  c.fillStyle = "#FFF1C4"; roundRect(c, 2, 2, 256, 9, 5); c.fill();
  c.strokeStyle = "#EDA23B"; c.lineWidth = 2.5; roundRect(c, 2, 2, 256, 22, 11); c.stroke();
})();
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ---------- 输入 ---------- */
function setDir() { dir = (rightOn ? 1 : 0) - (leftOn ? 1 : 0); }
function bindHold(el, set) {
  var on = function (e) { e.preventDefault(); set(true); if (el.classList) el.classList.add("pressed"); };
  var off = function (e) { if (e) e.preventDefault(); set(false); if (el.classList) el.classList.remove("pressed"); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("pointerleave", off);
}
bindHold($("leftBtn"), function (v) { leftOn = v; setDir(); });
bindHold($("rightBtn"), function (v) { rightOn = v; setDir(); });
canvas.addEventListener("pointerdown", function (e) {
  if (state !== S.PLAY) return;
  if (e.clientX < W / 2) leftOn = true; else rightOn = true;
  setDir();
});
canvas.addEventListener("pointerup", function () { leftOn = rightOn = false; setDir(); });
canvas.addEventListener("pointercancel", function () { leftOn = rightOn = false; setDir(); });
window.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { leftOn = true; setDir(); }
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { rightOn = true; setDir(); }
});
window.addEventListener("keyup", function (e) {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { leftOn = false; setDir(); }
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { rightOn = false; setDir(); }
});

/* ---------- 按钮 ---------- */
function startGame() {
  reset();
  state = S.PLAY;
  menuEl.classList.add("hidden");
  overEl.classList.add("hidden");
  controlsEl.classList.remove("hidden");
}
function goMenu() {
  state = S.MENU;
  overEl.classList.add("hidden");
  menuEl.classList.remove("hidden");
  controlsEl.classList.add("hidden");
  $("bestVal").textContent = best;
}
$("startBtn").addEventListener("click", startGame);
$("retryBtn").addEventListener("click", startGame);
$("homeBtn").addEventListener("click", goMenu);

function damage(reason) {
  if (invuln > 0) return;
  hearts--;
  invuln = INVULN;
  burst(player.x + PW / 2, player.y + PH / 2, "#FF6B81", 14);
  if (hearts <= 0) { gameOver("dead"); return; }
  if (reason === "ceiling") {
    // 被顶到天花板:瞬移到下方安全实心板恢复
    var best = null, bd = 1e9;
    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];
      if (!p.solid || p.type === "spike" || p.hit) continue;
      var d = p.y - player.y;
      if (d > 140 && d < bd) { bd = d; best = p; }
    }
    if (best) {
      player.y = best.y - PH; grounded = true; groundedPlat = best; player.vy = 0;
      player.x = Math.max(2, Math.min(W - PW - 2, best.x + best.w / 2 - PW / 2));
    } else { player.y = H * 0.55; grounded = false; player.vy = 0; }
  }
}
function gameOver(reason) {
  state = S.OVER;
  if (typeof window._onGameOver === "function") window._onGameOver(reason);
  controlsEl.classList.add("hidden");
  var isNew = score > best;
  if (isNew) { best = score; localStorage.setItem("qqfall_best", String(best)); }
  $("overScore").innerHTML = '这次下了 <b>' + score + '</b> 层';
  $("newBest").classList.toggle("hidden", !isNew);
  $("overTitle").textContent = "爱心掉光啦！";
  overEl.classList.remove("hidden");
}

function burst(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    parts.push({ x: x, y: y, vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 200 - 40, life: 0.6, c: color, r: 3 + Math.random() * 3 });
  }
}

/* ---------- 更新 ---------- */
function update(dt) {
  scrollSpd = 70 + Math.min(score * 1.3, 120);   // 越深顶得越快
  if (invuln > 0) invuln -= dt;

  // 板子整体上移 + 移动板横移 + 碎板计时
  var i, p;
  for (i = 0; i < plats.length; i++) {
    p = plats[i];
    p.px = p.x;
    p.y -= scrollSpd * dt;
    if (p.type === "move") {
      p.phase += dt * (1.6 + score * 0.01);
      p.x = p.baseX + Math.sin(p.phase) * p.amp;
      if (p.x < 6) p.x = 6;
      if (p.x > W - p.w - 6) p.x = W - p.w - 6;
    }
    if (p.type === "break" && p.breaking && !p.broken) {
      p.breakT += dt;
      if (p.breakT > BREAK_DELAY) {
        p.broken = true; p.solid = false;
        burst(p.x + p.w / 2, p.y + p.h / 2, "#A9DDE3", 10);
      }
    }
  }

  // 水平
  var tgt = dir * MOVE;
  player.vx += (tgt - player.vx) * Math.min(dt * 14, 1);
  player.x += player.vx * dt;
  if (player.x < 2) { player.x = 2; player.vx = 0; }
  if (player.x > W - PW - 2) { player.x = W - PW - 2; player.vx = 0; }
  if (Math.abs(player.vx) > 30) player.face = player.vx > 0 ? 1 : -1;

  // 站板上:跟随上移(移动板同步横移);走出板边缘则落下;板碎则落下
  if (grounded && groundedPlat) {
    var gp = groundedPlat;
    if (!gp.solid) { grounded = false; }
    else if (gp.y < CEIL_Y - 56) { grounded = false; }
    else {
      player.y = gp.y - PH; player.vy = 0;
      if (gp.type === "move") player.x += (gp.x - gp.px);
      var cx = player.x + PW / 2;
      var onIt = cx > gp.x + 5 && cx < gp.x + gp.w - 5;
      if (!onIt) grounded = false;
      if (player.x < 2) player.x = 2;
      if (player.x > W - PW - 2) player.x = W - PW - 2;
    }
  }

  // 空中:重力下落 + 落板判定(踩到板接住; 处于缝隙则穿过继续下落)
  if (!grounded) {
    var prevBottom = player.y + PH;
    player.vy += GRAV * dt;
    if (player.vy > MAXFALL) player.vy = MAXFALL;
    player.y += player.vy * dt;
    var bottom = player.y + PH;
    for (i = 0; i < plats.length; i++) {
      p = plats[i];
      if (!p.solid) continue;
      if (player.vy >= 0 && prevBottom <= p.y + 14 && bottom >= p.y - 2) {
        var c2 = player.x + PW / 2;
        var over = c2 > p.x + 4 && c2 < p.x + p.w - 4;
        if (!over) continue;          // 处于缝隙, 穿过不接
        player.y = p.y - PH; player.vy = 0;
        grounded = true; groundedPlat = p; player.squash = 1;
        if (!p.scored) { p.scored = true; score++; }
        if (p.type === "spike" && !p.hit) { p.hit = true; damage("spike"); }
        if (p.type === "break" && !p.breaking) { p.breaking = true; p.breakT = 0; }
        break;
      }
    }
  }
  player.squash = Math.max(0, player.squash - dt * 4);

  // 顶端尖刺天花板:玩家顶到就掉血
  if (player.y <= CEIL_Y && invuln <= 0) { damage("ceiling"); }

  // 闪电金币(挂在板子上, 跟随板子一起移动/上升; 板碎了闪电也消失)
  for (i = 0; i < coins.length; i++) {
    var c = coins[i];
    if (c.got) continue;
    if (c.bar) {
      if (c.bar.broken) { c.got = true; continue; }
      c.x = c.bar.x + c.bar.w / 2;
      c.y = c.bar.y - 24;
    }
    c.t += dt * 4;
    var cy = c.y + Math.sin(c.t) * 4;
    if (Math.abs(c.x - (player.x + PW / 2)) < PW * 0.7 && Math.abs(cy - (player.y + PH / 2)) < PH * 0.8) {
      c.got = true; coinsGot++; score += 5; burst(c.x, cy, "#FFC93C", 8);
    }
  }

  // 持续补充底部板子(散布短条):保证玩家下方始终有板, 绝不空场
  var bottomMost = CEIL_Y;
  for (i = 0; i < plats.length; i++) if (plats[i].y > bottomMost) bottomMost = plats[i].y;
  while (bottomMost < H + 120) {
    bottomMost += rowGap();
    var rb = makeRowBars(bottomMost);
    for (var k2 = 0; k2 < rb.length; k2++) plats.push(rb[k2]);
    spawnCoinOnRow(rb);
  }
  // 移除完全滚出顶部的板子
  while (plats.length && plats[0].y < -40) plats.shift();

  // 兜底: 万一仍掉到屏底之外, 吸附回最底部一块实心上, 绝不无限坠落
  if (state === S.PLAY && player.y > H + 40) {
    var bm = null;
    for (i = 0; i < plats.length; i++) {
      if (!plats[i].solid || plats[i].type === "spike") continue;
      if (plats[i].y > player.y && (!bm || plats[i].y < bm.y)) bm = plats[i];
    }
    if (bm) {
      player.y = bm.y - PH; player.vy = 0; grounded = true; groundedPlat = bm;
      player.x = Math.max(2, Math.min(W - PW - 2, bm.x + bm.w / 2 - PW / 2));
    } else {
      var nb = newPlat(player.y + 60, W / 2 - platWidth() / 2, platWidth());
      nb.type = "normal"; plats.push(nb);
      player.y = nb.y - PH; player.vy = 0; grounded = true; groundedPlat = nb;
      player.x = nb.x;
    }
  }

  // 粒子
  for (i = parts.length - 1; i >= 0; i--) {
    var q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
  // 背景星星
  for (i = 0; i < sparkles.length; i++) {
    var s = sparkles[i];
    s.t += dt * 2; s.y -= scrollSpd * 0.3 * dt;
    if (s.y < -10) { s.y = H + 10; s.x = Math.random() * W; }
  }
}

/* ---------- 绘制 ---------- */
function drawHeart(x, y, r, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(r / 16, r / 16);
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-2, 1, -14, -2, -14, -9);
  ctx.bezierCurveTo(-14, -17, -4, -18, 0, -10);
  ctx.bezierCurveTo(4, -18, 14, -17, 14, -9);
  ctx.bezierCurveTo(14, -2, 2, 1, 0, 6);
  ctx.closePath();
  if (filled) { ctx.fillStyle = "#FF6B81"; ctx.fill(); }
  else { ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.fill(); ctx.strokeStyle = "#E0A0AB"; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.restore();
}

function drawCeiling() {
  ctx.fillStyle = "#C98B6B";
  ctx.fillRect(0, 0, W, 14);
  var n = Math.ceil(W / 22);
  for (var k = 0; k < n; k++) {
    var sx = k * 22 + 11;
    ctx.beginPath();
    ctx.moveTo(sx - 9, 14); ctx.lineTo(sx, 32); ctx.lineTo(sx + 9, 14);
    ctx.closePath();
    ctx.fillStyle = "#8A5A3B"; ctx.fill();
    ctx.beginPath(); ctx.arc(sx, 28, 2.4, 0, 6.283);
    ctx.fillStyle = "#FF6B81"; ctx.fill();
  }
}

function drawLightning(x, y, sc, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(sc, sc);
  ctx.beginPath();
  ctx.moveTo(2, -12); ctx.lineTo(-6, 2); ctx.lineTo(-1, 2);
  ctx.lineTo(-3, 12); ctx.lineTo(6, -2); ctx.lineTo(1, -2);
  ctx.closePath();
  ctx.fillStyle = "#FFD34D"; ctx.fill();
  ctx.strokeStyle = "#F5A623"; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.restore();
}

function drawBar(x, y, w, h, fillTop, fillBot, stroke) {
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, fillTop); g.addColorStop(1, fillBot);
  ctx.fillStyle = g; roundRect(ctx, x, y, w, h, 9); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.5)"; roundRect(ctx, x + 2, y + 2, w - 4, Math.min(8, h * 0.4), 4); ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; roundRect(ctx, x, y, w, h, 9); ctx.stroke();
}

function drawPlat(p) {
  if (p.broken) return;                       // 已碎裂的板不再绘制
  if (p.type === "spike") { drawSpikeBar(p.x, p.y, p.w); return; }
  var alpha = 1;
  if (p.type === "break" && p.breaking) alpha = 0.4 + 0.6 * Math.abs(Math.sin(p.breakT * 18));
  ctx.globalAlpha = alpha;
  if (p.type === "break") {
    // 会碎的板: 浅青色 + 裂纹, 提示"踩上去会碎"
    drawBar(p.x, p.y, p.w, p.h, "#CFEFF2", "#A9DDE3", "#7FB9C2");
    ctx.strokeStyle = "rgba(70,120,130,.7)"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w * 0.3, p.y + 2); ctx.lineTo(p.x + p.w * 0.46, p.y + p.h - 2);
    ctx.moveTo(p.x + p.w * 0.62, p.y + 2); ctx.lineTo(p.x + p.w * 0.52, p.y + p.h - 2);
    ctx.stroke();
  } else {
    // 正常板: 饼干黄
    drawBar(p.x, p.y, p.w, p.h, "#FFDC7E", "#FFC95E", "#EDA23B");
    if (p.type === "move") {
      // 左右移动的板: 两侧蓝点提示
      ctx.fillStyle = "rgba(122,160,220,.95)";
      ctx.beginPath(); ctx.arc(p.x + 12, p.y + p.h / 2, 3.4, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x + p.w - 12, p.y + p.h / 2, 3.4, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawSpikeBar(x, y, w) {
  if (w < 6) return;
  ctx.fillStyle = "#C98B6B"; roundRect(ctx, x, y + 6, w, 14, 7); ctx.fill();
  ctx.strokeStyle = "#A5674A"; ctx.lineWidth = 2; roundRect(ctx, x, y + 6, w, 14, 7); ctx.stroke();
  var m = Math.max(2, Math.floor(w / 22));
  for (var k = 0; k < m; k++) {
    var sx = x + (k + 0.5) * (w / m);
    ctx.beginPath(); ctx.moveTo(sx - 7, y + 8); ctx.lineTo(sx, y - 6); ctx.lineTo(sx + 7, y + 8);
    ctx.closePath(); ctx.fillStyle = "#8A5A3B"; ctx.fill();
    ctx.beginPath(); ctx.arc(sx, y - 4, 2, 0, 6.283); ctx.fillStyle = "#FF6B81"; ctx.fill();
  }
}
function draw() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#FFF6E3"); g.addColorStop(1, "#FFE8C2");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (var i = 0; i < sparkles.length; i++) {
    var s = sparkles[i];
    var a = 0.35 + Math.sin(s.t) * 0.25;
    if (a <= 0.05) continue;
    ctx.globalAlpha = a; ctx.fillStyle = "#F5C86B";
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.2 * s.s, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }

  drawCeiling();

  // 板子(散布短条: 正常/带刺/会碎/左右移动)
  for (i = 0; i < plats.length; i++) {
    var p = plats[i];
    if (p.y < CEIL_Y - 40 || p.y > H + 60) continue;
    drawPlat(p);
  }

  // 闪电金币
  for (i = 0; i < coins.length; i++) {
    var co = coins[i];
    if (co.got || co.y < CEIL_Y - 20 || co.y > H + 30) continue;
    drawLightning(co.x, co.y + Math.sin(co.t) * 4, 1.15, Math.sin(co.t * 0.6) * 0.25);
  }

  // 粒子
  for (i = 0; i < parts.length; i++) {
    var q = parts[i];
    ctx.globalAlpha = Math.max(0, q.life / 0.6);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 玩家(受击闪烁)
  if (state === S.PLAY || state === S.OVER) {
    if (!(invuln > 0 && Math.floor(invuln * 12) % 2 === 0)) {
      var sq = 1 - player.squash * 0.16;
      var sw = PW * (1 + (1 - sq) * 0.5);
      ctx.save();
      ctx.translate(player.x + PW / 2, player.y + PH);
      ctx.scale(player.face * (sw / PW), sq);
      if (imgReady) ctx.drawImage(playerImg, -PW / 2, -PH, PW, PH);
      else { ctx.fillStyle = "#5B4232"; roundRect(ctx, -PW / 2, -PH, PW, PH, 10); ctx.fill(); }
      ctx.restore();
    }
  }

  // 血条(左上角)
  if (state === S.PLAY) {
    for (i = 0; i < 2; i++) drawHeart(24 + i * 30, 46, 12, i < hearts);
    ctx.save();
    ctx.font = "800 40px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "right";
    ctx.lineWidth = 6; ctx.strokeStyle = "rgba(255,255,255,.85)";
    ctx.strokeText(String(score), W - 18, 86);
    ctx.fillStyle = "#5B4232";
    ctx.fillText(String(score), W - 18, 86);
    ctx.font = "600 12px sans-serif";
    ctx.fillStyle = "#B08A63";
    ctx.fillText("闪电 ×" + coinsGot, W - 18, 110);
    ctx.restore();
  }
}

/* ---------- 主循环(防卡死) ---------- */
var lastT = 0, running = false;
function loop(t) {
  if (!running) return;
  var dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  try {
    if (state === S.PLAY) update(dt);
    draw();
  } catch (err) {
    console.error(err);
    running = false; state = S.MENU;
    menuEl.classList.remove("hidden"); controlsEl.classList.add("hidden");
    return;
  }
  requestAnimationFrame(loop);
}
function kickLoop() {
  if (running) return;
  running = true; lastT = performance.now();
  requestAnimationFrame(loop);
}
window.__dbg = {
  forceSpike: function () { for (var i = 0; i < plats.length; i++) if (plats[i].y > player.y) { plats[i].type = "spike"; break; } },
  hurt: function () { hearts = 1; damage("spike"); },
  info: function () { return { state: state, score: score, hearts: hearts, plats: plats.length, py: Math.round(player.y), grounded: grounded }; }
};
kickLoop();
reset();
</script>
</body>
